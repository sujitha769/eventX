services:

  # =========================
  # KAFKA
  # =========================
  kafka:
    image: apache/kafka:4.0.0
    container_name: eventx-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    networks:
      - eventx-network


  # =========================
  # ORGANIZER MYSQL
  # =========================
  organizer-mysql:
    image: mysql:8.4
    container_name: organizer-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: organizer_db
    ports:
      - "3307:3306"
    volumes:
      - organizer-service_organizer_mysql_data:/var/lib/mysql
    networks:
      - eventx-network


  # =========================
  # REGISTRATION MYSQL
  # =========================
  registration-mysql:
    image: mysql:8.4
    container_name: registration-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: registration_db
    ports:
      - "3308:3306"
    volumes:
      - registration-service_registration_mysql_data:/var/lib/mysql
    networks:
      - eventx-network


  # =========================
  # ANALYTICS MYSQL
  # =========================
  analytics-mysql:
    image: mysql:8.4
    container_name: analytics-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: analytics_db
    ports:
      - "3309:3306"
    volumes:
      - analytics-service_analytics_mysql_data:/var/lib/mysql
    networks:
      - eventx-network


  # =========================
  # EUREKA SERVER
  # =========================
  eureka-server:
    build:
      context: ./eureka-server
    container_name: eventx-eureka
    ports:
      - "8761:8761"
    networks:
      - eventx-network


  # =========================
  # ORGANIZER SERVICE
  # =========================
  organizer-service:
    build:
      context: ./organizer-service
    container_name: eventx-organizer
    ports:
      - "8081:8081"
    depends_on:
      - organizer-mysql
      - eureka-server
    networks:
      - eventx-network


  # =========================
  # REGISTRATION SERVICE
  # =========================
  registration-service:
    build:
      context: ./registration-service
    container_name: eventx-registration
    ports:
      - "8082:8082"
    depends_on:
      - registration-mysql
      - kafka
      - eureka-server
      - organizer-service
    networks:
      - eventx-network


  # =========================
  # ANALYTICS SERVICE
  # =========================
  analytics-service:
    build:
      context: ./analytics-service
    container_name: eventx-analytics
    ports:
      - "8083:8083"
    depends_on:
      - analytics-mysql
      - kafka
      - eureka-server
    networks:
      - eventx-network


  # =========================
  # NOTIFICATION SERVICE
  # =========================
  notification-service:
    build:
      context: ./notification-service
    container_name: eventx-notification
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - eureka-server
    networks:
      - eventx-network


  # =========================
  # API GATEWAY
  # =========================
  api-gateway:
    build:
      context: ./api-gateway
    container_name: eventx-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server
      - organizer-service
      - registration-service
      - analytics-service
    networks:
      - eventx-network


# =========================
# EXISTING DATABASE VOLUMES
# =========================
volumes:

  organizer-service_organizer_mysql_data:
    external: true

  registration-service_registration_mysql_data:
    external: true

  analytics-service_analytics_mysql_data:
    external: true


# =========================
# EVENTX NETWORK
# =========================
networks:

  eventx-network:
    driver: bridge